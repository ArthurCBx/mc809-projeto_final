syntax = "proto3";

package federated;

message ClientLogits {
    int32 client_id       = 1;
    repeated float logits = 2;
    float public_accuracy = 3;  // acurácia do cliente no subconjunto público da rodada; peso no consenso
}

message ServerConsensus {
    repeated float consensus_logits = 1;
}

service FedMDLearning {
    rpc SendClientLogits(ClientLogits) returns (ServerConsensus);
}